[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "h4kfi"
dynamic = ["version"]
description = "Wireless penetration testing framework with first-class MCP integration for OpenCode"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.9"
authors = [{name = "digenaldo"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2.0"]

[project.scripts]
h4kfi = "h4kfi.cli:main"
h4kfi-mcp = "h4kfi.mcp_server:main"

[project.urls]
Homepage = "https://github.com/digenaldo/h4kfi"
Repository = "https://github.com/digenaldo/h4kfi"
Issues = "https://github.com/digenaldo/h4kfi/issues"

[tool.setuptools.packages.find]
include = ["h4kfi*"]

[tool.setuptools_scm]
version_scheme = "release-branch-semver"
fallback_version = "0.0.0"
